<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prospect Nexus AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
      }
       /* Global Animations */
      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease-out forwards;
      }
      
      @keyframes fade-in-fast {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in-fast { 
        animation: fade-in-fast 0.2s ease-out forwards; 
      }

      @keyframes slide-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up { 
        animation: slide-up 0.3s ease-out forwards; 
      }
      
      @keyframes sonar-pulse-location {
        0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 211, 238, 0); }
        100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(34, 211, 238, 0); }
      }
      .animate-sonar-pulse-location {
        animation: sonar-pulse-location 1.5s infinite;
      }
      
      /* New Eye Loading Spinner Animations */
      @keyframes look-around {
        0%, 100% { transform: translate(0, 0); }
        15% { transform: translate(-20px, -10px); } /* Mira arriba-izquierda */
        30% { transform: translate(20px, 15px); } /* Mira abajo-derecha */
        45% { transform: translate(0, 0); } /* Centra */
        60% { transform: translate(15px, -15px); } /* Mira arriba-derecha */
        75% { transform: translate(-15px, 10px); } /* Mira abajo-izquierda */
        90% { transform: translate(0, 0); } /* Centra */
      }
      
      @keyframes blink-main-eye {
        0%, 45%, 50%, 95%, 100% { transform: scaleY(1); }
        47.5%, 97.5% { transform: scaleY(0.05); }
      }

      @keyframes terminator-glow {
        0%, 90% { background-color: currentColor; box-shadow: none; }
        92% { background-color: #ef4444; box-shadow: 0 0 5px #ef4444, 0 0 10px #ef4444; }
        98% { background-color: #ef4444; box-shadow: 0 0 5px #ef4444, 0 0 10px #ef4444; }
        100% { background-color: currentColor; box-shadow: none; }
      }

      /* New Radar Logo Animations */
      @keyframes radar-sweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes radar-blip {
        0%, 100% { opacity: 0; transform: scale(0.5); }
        5% { opacity: 1; transform: scale(1); }
        20% { opacity: 0; transform: scale(1.2); }
      }
      @keyframes radar-pulse {
        from {
          r: 0;
          opacity: 0.8;
        }
        to {
          r: 45;
          opacity: 0;
        }
      }
      /* Light mode gradient for radar - Corrected: transparent center, colored edge */
      #radarGradient-light stop:nth-child(1) { stop-color: rgba(6, 182, 212, 0); }
      #radarGradient-light stop:nth-child(2) { stop-color: rgba(6, 182, 212, 0.6); }
      /* Dark mode gradient for radar - Corrected: transparent center, colored edge */
      .dark #radarGradient-dark stop:nth-child(1) { stop-color: rgba(250, 204, 21, 0); }
      .dark #radarGradient-dark stop:nth-child(2) { stop-color: rgba(250, 204, 21, 0.6); }

      /* Glow Pulse for Information Icon */
      @keyframes glow-pulse {
        0%, 100% {
          filter: drop-shadow(0 0 2px rgba(6, 182, 212, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 6px rgba(6, 182, 212, 0.9));
        }
      }
      .animate-glow-pulse {
        animation: glow-pulse 2.5s infinite ease-in-out;
      }

      /* Custom Scrollbar Styles */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #f59e0b; /* Amber 500 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #d97706; /* Amber 600 */
      }
    </style>
